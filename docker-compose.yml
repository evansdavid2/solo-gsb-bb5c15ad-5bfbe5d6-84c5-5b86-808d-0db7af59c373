services:
  stage-cues:
    build: .
    image: stage-change-cue-sheet
    container_name: stage-change-cue-sheet
    ports:
      # 宿主机端口:容器端口；可用环境变量 HOST_PORT 覆盖宿主机端口
      - "${HOST_PORT:-3000}:3000"
    environment:
      # 应用监听端口（容器内），通常无需修改
      PORT: "3000"
      DB_PATH: /app/data/stage.db
    volumes:
      # SQLite 数据持久化到宿主机 ./data
      - ./data:/app/data
    restart: unless-stopped
